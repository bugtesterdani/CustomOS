name: Build Floppy Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - NewOS

permissions:
  contents: write

jobs:
  build-floppy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build floppy artifact
        run: .github/scripts/build-artifacts.sh

      - name: Package browser emulator
        run: .github/scripts/package-web-emulator.sh

      - name: Create browser emulator archive
        run: tar -czf build/customos-browser-emulator.tar.gz -C build web

      - name: Upload floppy image
        uses: actions/upload-artifact@v4
        with:
          name: customos-floppy
          path: |
            build/floppy.img
            build/floppy.img.gz
          if-no-files-found: error

      - name: Upload browser emulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: customos-browser-emulator
          path: build/web
          if-no-files-found: error

      - name: Publish unified release
        uses: ncipollo/release-action@v1
        with:
          tag: build-artifacts
          name: CustomOS Build Artifacts
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifacts: |
            build/floppy.img
            build/floppy.img.gz
            build/customos-browser-emulator.tar.gz
          body: |
            Latest build artifacts are published under a single stable release tag: `build-artifacts`.

            Download links:
            - [customos-floppy (raw image)](https://github.com/${{ github.repository }}/releases/download/build-artifacts/floppy.img)
            - [customos-floppy (gzip)](https://github.com/${{ github.repository }}/releases/download/build-artifacts/floppy.img.gz)
            - [customos-browser-emulator (tar.gz)](https://github.com/${{ github.repository }}/releases/download/build-artifacts/customos-browser-emulator.tar.gz)
